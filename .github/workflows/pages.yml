# Version provisoire du site sur GitHub Pages (https://teiki5320.github.io/keurbook/),
# en attendant keurbook.com sur Cloudflare Pages. Pages non indexées par les moteurs de recherche.
# Se lance à chaque push sur main, chaque lundi (articles « Conseils » programmés) et à la main.
# Pour l'arrêter : Settings → Pages → désactiver, puis supprimer ce fichier.
name: Publier la version provisoire (GitHub Pages)

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "20 23 * * 0"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  construire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Vérifier (lint, types, tests)
        run: |
          npm run lint
          npm run typecheck
          npm test
      - name: Construire le site (sous-dossier /keurbook, non indexé)
        run: npm run build
        env:
          NEXT_PUBLIC_BASE_PATH: /keurbook
          NEXT_PUBLIC_SITE_URL: https://teiki5320.github.io/keurbook
          NEXT_PUBLIC_NOINDEX: "1"
          NEXT_TELEMETRY_DISABLED: 1
      - run: touch out/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  publier:
    needs: construire
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - id: deploiement
        uses: actions/deploy-pages@v4
